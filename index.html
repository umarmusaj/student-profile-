<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            width: 85px;
            height: 85px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #1e3a8a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            color: #111827;
            margin-bottom: 8px;
            font-size: 27px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .info {
            text-align: left;
        }

        .item {
            background: #f3f4f6;
            padding: 17px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .label {
            display: block;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .value {
            color: #111827;
            font-size: 17px;
            font-weight: bold;
        }

        .matric {
            color: #1e3a8a;
        }

        .footer {
            margin-top: 25px;
            color: #6b7280;
            font-size: 12px;
        }

        @media (max-width: 400px) {
            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">

            <div class="logo">UM</div>

            <h1>Student Profile</h1>

            <p class="subtitle">
                Student Academic Information
            </p>

            <div class="info">

                <div class="item">
                    <span class="label">Full Name</span>
                    <span class="value">Umar Musa</span>
                </div>

                <div class="item">
                    <span class="label">Matriculation Number</span>
                    <span class="value matric">CSC/2024/1234</span>
                </div>

                <div class="item">
                    <span class="label">Department</span>
                    <span class="value">Computer Science and Education</span>
                </div>

                <div class="item">
                    <span class="label">School / University</span>
                    <span class="value">XYZ University</span>
                </div>

            </div>

            <div class="footer">
                © 2026 Umar Musa | Student Profile
            </div>

        </div>
    </div>

</body>
  </html>
