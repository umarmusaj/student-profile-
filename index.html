<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umar Musa - Student Profile</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 30px 25px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            text-align: center;
        }

        .icon {
            width: 90px;
            height: 90px;
            background: #1769aa;
            color: white;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            color: #1769aa;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .info {
            text-align: left;
        }

        .item {
            background: #f5f7fa;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
        }

        .label {
            font-size: 13px;
            color: #777;
            margin-bottom: 5px;
        }

        .value {
            font-size: 17px;
            font-weight: bold;
            color: #222;
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">🎓</div>

        <h1>Student Profile</h1>
        <p class="subtitle">Academic Information</p>

        <div class="info">

            <div class="item">
                <div class="label">NAME</div>
                <div class="value">Umar Musa</div>
            </div>

            <div class="item">
                <div class="label">MATRIC NUMBER</div>
                <div class="value">CSEU/25/10702</div>
            </div>

            <div class="item">
                <div class="label">DEPARTMENT</div>
                <div class="value">Computer Science and Education</div>
            </div>

            <div class="item">
                <div class="label">SCHOOL</div>
                <div class="value">Sa'adu Zungur University</div>
            </div>

        </div>

        <footer>
            Student Academic Profile Application<br>
            Sa'adu Zungur University
        </footer>

    </div>

</body>
</html>
