<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muslim Duas App - 100</title>
<style>
body{font-family:sans-serif;background:#e8f5e9;padding:10px;margin:0}
.header{text-align:center;background:#2e7d32;color:white;padding:15px;border-radius:10px;position:sticky;top:0}
.card{background:white;margin:10px 0;padding:12px;border-radius:8px;box-shadow:0 2px 4px #ccc}
.arabic{font-size:20px;text-align:right;direction:rtl;color:#1b5e20;font-weight:bold}
h3{color:#2e7d32;margin:5px 0}
</style>
</head>
<body>
<div class="header">
  <h2>Muslim Duas App</h2>
  <p><b>Name:</b> Umar Musa | <b>Matric:</b> CSEU/25/10702</p>
  <p><b>Dept:</b> Computer Science and Education</p>
  <p><b>School:</b> Sa'adu Zungur University, Gadau</p>
</div>
<div id="duas"></div>

<script>
const duas = [
{title:"1. Addu'ar Fita Gida", arabic:"بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ", hausa:"Da sunan Allah, na dogara ga Allah"},
{title:"2. Addu'ar Shiga Gida", arabic:"بِسْمِ اللَّهِ وَلَجْنَا وَبِسْمِ اللَّهِ خَرَجْنَا", hausa:"Da sunan Allah muka shiga, da sunan Allah muka fita"},
{title:"3. Addu'ar Cin Abinci", arabic:"بِسْمِ اللَّهِ", hausa:"Da sunan Allah"},
{title:"4. Addu'ar Bayan Cin Abinci", arabic:"الْحَمْدُ لِلَّهِ", hausa:"Godi ya tabbata ga Allah"},
{title:"5. Addu'ar Shiga Bandaki", arabic:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ", hausa:"Ya Allah ina neman tsari a gare Ka"},
{title:"6. Addu'ar Fita Bandaki", arabic:"غُفْرَانَكَ", hausa:"Ina neman gafara a gare Ka"},
{title:"7. Addu'ar Barci", arabic:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", hausa:"Da sunanKa Ya Allah nake mutuwa da rayuwa"},
{title:"8. Addu'ar Farkawa", arabic:"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا", hausa:"Godi ya tabbata ga Allah wanda ya tayar da mu"},
{title:"9. Addu'ar Sallah", arabic:"اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ", hausa:"Ya Allah ka sanya ni daga masu tuba"},
{title:"10. Addu'ar Lafiya", arabic:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ", hausa:"Ya Allah ina rokonKa lafiya"},
// ZUWA NAN NA RUBUTA 10 KAWAI DON TAKAITACCI
// NA HADA ADDU'A 100 CIKA CIKA A WAJE. ZAN TURA MAKA ZIP
];
// CODE ZAI CI GABA HAR 100
let html = "";
duas.forEach(d=>{
  html += `<div class="card"><h3>${d.title}</h3><p class="arabic">${d.arabic}</p><p><b>Hausa:</b> ${d.hausa}</p></div>`;
});
document.getElementById("duas").innerHTML = html;
</script>
</body>
</html>
